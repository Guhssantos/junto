# Aplica as migrações do banco e publica a Edge Function de push sempre que
# algo em supabase/ muda na branch main. Opcional: sem os secrets, só avisa.
#
# Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   o "abcd1234" de https://abcd1234.supabase.co
#   SUPABASE_DB_PASSWORD   senha do banco definida ao criar o projeto
name: Deploy backend (Supabase)

on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Verificar configuração
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Secrets do Supabase não configurados; deploy do backend ignorado."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.skip != 'true'
        with:
          version: latest
      - name: Migrações
        if: steps.check.outputs.skip != 'true'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Edge Function send-push
        if: steps.check.outputs.skip != 'true'
        run: supabase functions deploy send-push --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
